services:
  - type: web
    name: datamine-pro-api
    runtime: python
    plan: free
    rootDir: datamine-pro/datamine-pro/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://datamine-pro.vercel.app,https://datamine-i9hoq875a-helalacademyofficial95-3918.vercel.app,http://localhost:3000
      - key: CRAWLER_USER_AGENT
        sync: false
      # Long random secret. Enables POST /enrichment/run (disabled while unset). Never commit its value.
      - key: ENRICHMENT_ADMIN_TOKEN
        sync: false
