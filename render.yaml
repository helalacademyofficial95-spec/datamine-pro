services:
  - type: web
    name: datamine-pro-api
    runtime: python
    plan: free
    rootDir: datamine-pro/datamine-pro/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://datamine-pro.vercel.app,http://localhost:3000
      - key: CRAWLER_USER_AGENT
        sync: false
