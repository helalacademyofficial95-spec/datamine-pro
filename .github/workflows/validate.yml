name: Validate DataMine Pro

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/python-extraction-backend]

jobs:
  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend modules
        run: python -m compileall -q datamine-pro/datamine-pro/backend/app
      - name: Install backend dependencies
        run: pip install -r datamine-pro/datamine-pro/backend/requirements.txt -r datamine-pro/datamine-pro/backend/requirements-dev.txt
      - name: Backend tests
        working-directory: datamine-pro/datamine-pro/backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: python -m pytest -q

  frontend-logic:
    name: Frontend filter and export tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run filter and export tests
        working-directory: datamine-pro/datamine-pro
        run: node --experimental-strip-types --no-warnings --import ./tests/register-ts.mjs --test tests/frontend.test.mts

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datamine-pro/datamine-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: datamine-pro/datamine-pro/package.json
      - name: Install dependencies
        run: npm install
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
